<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SL India - Login</title>

    <link rel="stylesheet" href="../CSS/login.css">

</head>

<body class="login-page">


    <!-- ================= HEADER ================= -->

    <!-- <header class="hero-header">

        <a href="index.html">

            <img
                src="images/Banners/August2026/IEC.png"
                alt="IEC - India Engineering Center"
                class="login-logo"
            >

        </a>

    </header> -->


    <!-- ================= LOGIN ================= -->

    <main class="login-container">

        <div class="login-card">

            <h1>
                Welcome to SL Chennai
            </h1>

            <p class="login-subtitle">
                Employee Login
            </p>


            <form
                action="dashboard_IEC.html"
                method="get"
                class="login-form"
            >

                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="5"
                        required
                    >

                </div>


                <!-- Login -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <a
                href="home.html"
                class="back-link"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

        <p>
            SL Chennai © 2026
        </p>

    </footer>

</body>
</html>
